version: "1.0"

# Identity: Target user configuration
identity:
  username: "user"
  shell: "/bin/zsh"

# Infrastructure: Hardware and storage configuration
infrastructure:
  luks:
    device: "/dev/nvme0n1p4"
    mapper_name: "company_data"
    mount_point: "/mnt/company_data"

# System: OS-level packages and services
system:
  # Repos needed before `pkgs` can install from them. Two shapes:
  # - id only: an already-shipped repo (e.g. one from a repo package
  #   already in `pkgs` below) whose enabled= flag just needs flipping on.
  #   Don't rely on this for repos you haven't confirmed ship pre-added on
  #   a base install (e.g. google-chrome.repo requires the
  #   fedora-workstation-repositories package first, and isn't present at
  #   all on some installs) -- use the baseurl shape instead if unsure.
  # - id + baseurl: a repo file that doesn't exist yet and must be created
  #   (gpgkey, if set, is imported via rpm --import).
  pkg_repos:
    - id: google-chrome
      baseurl: "https://dl.google.com/linux/chrome/rpm/stable/x86_64"
      gpgkey: "https://dl.google.com/linux/linux_signing_key.pub"
      enabled: true

    - id: vscode
      baseurl: "https://packages.microsoft.com/yumrepos/vscode"
      gpgkey: "https://packages.microsoft.com/keys/microsoft.asc"
      enabled: true

  pkgs:
    - git
    - zsh
    - docker
    - fprintd
    - google-chrome-stable
    - code

  pinned_packages: []
  services: []

  # Paths removed on every boot via systemd-tmpfiles (systemd's own
  # systemd-tmpfiles-setup.service, already enabled by default -- no
  # custom unit needed). Useful for a stale app lock file left behind by
  # an unclean shutdown.
  tmpfiles:
    - "~/.config/google-chrome/SingletonLock"

  # Users and groups (name only, no ID)
  users:
    - name: "docker"
      system: true
      groups:
        - docker

    - name: "devuser"
      system: false
      groups:
        - wheel  # sudoer via wheel group
        - docker

  groups:
    - name: "docker"
      system: true

# UserSpace: User-level configuration (Block IV)
userspace:
  dehydration:
    # Paths to collect during dehydration (including large files)
    paths:
      - "~/.zshrc"
      - "~/.config/nvim/"
      - "~/.ssh/"
      - "~/.gitconfig"
      - "~/Documents/"
      - "~/Videos/"

  repos:
    - url: "git@github.com:user/project-alpha.git"
      dest: "~/Workspace/project-alpha"

  # Ordered Block IV steps, run as the target user (not root). By default
  # (no step below has `run: dehydration` or `run: repos`), the
  # dehydration restore and repo clones above happen automatically before
  # any `script` steps run. Placing `run: dehydration`/`run: repos`
  # explicitly (like below) opts out of that default so you can place
  # custom commands around them -- here, oh-my-zsh's installer
  # unconditionally overwrites .zshrc, so it has to run *before* the
  # dehydration restore, or it'd clobber the .zshrc that restore just
  # wrote back.
  #
  # Trisolaran can't check-diff arbitrary shell, so making a `script` line
  # safe to rerun (like the guard below) is on you -- one that errors out
  # on a second run will abort the whole rehydra.
  pipeline:
    - script: '[ -d "$HOME/.oh-my-zsh" ] || sh -c "$(wget -O- https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
    - run: dehydration
    - run: repos
