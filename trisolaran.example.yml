version: "1.0"

# Identity: Target user configuration
identity:
  username: "user"
  shell: "/bin/zsh"

# Infrastructure: Hardware and storage configuration
infrastructure:
  luks:
    device: "/dev/nvme0n1p4"
    mapper_name: "company_data"
    mount_point: "/mnt/company_data"

# System: OS-level packages and services
system:
  # Repos needed before `pkgs` can install from them. Two shapes:
  # - id only: an already-shipped repo (e.g. Fedora's google-chrome.repo)
  #   whose enabled= flag just needs flipping on.
  # - id + baseurl: a repo file that doesn't exist yet and must be created
  #   (gpgkey, if set, is imported via rpm --import).
  pkg_repos:
    - id: google-chrome-stable
      enabled: true

    - id: vscode
      baseurl: "https://packages.microsoft.com/yumrepos/vscode"
      gpgkey: "https://packages.microsoft.com/keys/microsoft.asc"
      enabled: true

  pkgs:
    - git
    - zsh
    - docker
    - fprintd

  pinned_packages: []
  services: []

  # Users and groups (name only, no ID)
  users:
    - name: "docker"
      system: true
      groups:
        - docker

    - name: "devuser"
      system: false
      groups:
        - wheel  # sudoer via wheel group
        - docker

  groups:
    - name: "docker"
      system: true

# UserSpace: User-level configuration (Block IV)
userspace:
  dehydration:
    # Paths to collect during dehydration (including large files)
    paths:
      - "~/.zshrc"
      - "~/.config/nvim/"
      - "~/.ssh/"
      - "~/.gitconfig"
      - "~/Documents/"
      - "~/Videos/"

  repos:
    - url: "git@github.com:user/project-alpha.git"
      dest: "~/Workspace/project-alpha"

  # One-liner shell commands, run as the target user (not root), last in
  # Block IV (after the artifact is restored and repos are cloned), for
  # anything that can't just be a dnf package.
  scripts:
    - 'sh -c "$(wget -O- https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
